<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Creative Review</title><link rel="stylesheet" href="/creative-review.css"></head>
<body><main class="review-shell"><header><span>PRIVATE REVIEW SESSION</span><h1 data-title>Opening review…</h1><p data-status aria-live="polite">Checking access.</p></header><section data-workspace hidden><nav data-versions aria-label="Creative versions"></nav><article><img data-asset alt="Creative under review"><h2 data-version-title></h2><p data-version-note></p></article><aside><h2>Feedback</h2><div data-history></div><form data-comment><label>Your name<input name="authorName" required maxlength="80"></label><label>Comment<textarea name="body" required maxlength="3000" rows="5"></textarea></label><button>ADD COMMENT</button></form><form data-decision><label>Decision<select name="decision"><option value="CHANGES_REQUESTED">REQUEST CHANGES</option><option value="APPROVED">APPROVE THIS VERSION</option></select></label><label>Your name<input name="actorName" required maxlength="80"></label><label>Note<textarea name="note" maxlength="3000" rows="4"></textarea></label><button>RECORD DECISION</button></form></aside></section></main><script src="/creative-review.js" defer></script></body></html>
