<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Page Studio Preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/page-studio-public.css"></head><body><header id="pageStudioNavigation" class="ps-navigation"></header><main id="pageStudioRoot"><div class="ps-empty">Loading private preview…</div></main><script src="/page-studio-renderer.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{try{const id=new URLSearchParams(location.search).get('id'),[page,bootstrap]=await Promise.all([fetch('/api/admin/page-studio/pages/'+encodeURIComponent(id),{credentials:'include'}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Preview unavailable');return d.page}),fetch('/api/admin/page-studio/bootstrap',{credentials:'include'}).then(r=>r.json())]);document.title=page.title+' — Private Preview';window.PageStudioRenderer.render({page,dynamic:bootstrap.dynamic,trustedOrigins:(bootstrap.embedSources||[]).filter(x=>x.enabled&&x.allowIframe).map(x=>x.origin),navigationPreset:page.navbarPreset||(bootstrap.navigationPresets||[]).find(x=>x.isGlobal),editor:false,device:'desktop'})}catch(error){document.querySelector('#pageStudioRoot').innerHTML='<div class="ps-empty">'+String(error.message||error)+'</div>'}})</script></body></html>
