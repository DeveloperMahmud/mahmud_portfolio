name: Live Admin Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-admin-audit.yml
      - playwright.live.config.mjs
      - tests/live/**
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      base_url:
        description: Live site origin (no trailing slash)
        required: true
        default: https://mahmudportfolio-azure.vercel.app

permissions:
  contents: read

concurrency:
  group: live-admin-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Non-destructive production CMS audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_BASE_URL: ${{ inputs.base_url }}
      LIVE_ADMIN_EMAIL: ${{ secrets.LIVE_ADMIN_EMAIL }}
      LIVE_ADMIN_PASSWORD: ${{ secrets.LIVE_ADMIN_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live admin audit
        run: npm run test:live-admin

      - name: Upload audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-admin-audit-${{ github.run_number }}
          path: |
            playwright-report/live-admin
            test-results/live-admin
          if-no-files-found: warn
          retention-days: 14
